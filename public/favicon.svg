<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="liveDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded TV Frame -->
  <rect x="32" y="96" width="448" height="336" rx="64" fill="url(#tvGrad)" />
  
  <!-- Inner Screen -->
  <rect x="56" y="120" width="400" height="288" rx="44" fill="url(#screenGrad)" />
  
  <!-- Antennae -->
  <path d="M192 48 L240 96 M320 48 L272 96" stroke="url(#tvGrad)" stroke-width="24" stroke-linecap="round" />
  
  <!-- Play Symbol -->
  <polygon points="216,196 336,264 216,332" fill="url(#tvGrad)" />
  
  <!-- Live Pulsing Indicator -->
  <circle cx="410" cy="160" r="16" fill="url(#liveDot)" />
  <circle cx="410" cy="160" r="24" fill="#ef4444" opacity="0.4" />
  
  <!-- Base Stand -->
  <path d="M192 448 L320 448" stroke="url(#tvGrad)" stroke-width="20" stroke-linecap="round" />
  <path d="M256 432 L256 448" stroke="url(#tvGrad)" stroke-width="20" stroke-linecap="round" />
</svg>
